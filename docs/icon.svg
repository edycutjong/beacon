<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#06b6d4" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#dotGrid)"/>

  <!-- Outer Orbit / Mesh Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#0f172a" stroke-width="32"/>
  <!-- Rotating dashed mesh ring — the active P2P mesh scanning for peers -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#06b6d4" stroke-width="8" opacity="0.5" stroke-dasharray="20 10">
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="24s" repeatCount="indefinite"/>
  </circle>

  <!-- Radar ping — the beacon broadcasting outward from the core -->
  <g fill="none" stroke="#06b6d4" stroke-width="5">
    <circle cx="256" cy="256" r="48" opacity="0">
      <animate attributeName="r" values="48;164" dur="2.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.6 0.3 1"/>
      <animate attributeName="opacity" values="0.55;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="256" cy="256" r="48" opacity="0">
      <animate attributeName="r" values="48;164" dur="2.8s" begin="1.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.6 0.3 1"/>
      <animate attributeName="opacity" values="0.55;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Emitting Radio Waves (Upwards) — ripple outward in sequence -->
  <path d="M 176 176 A 110 110 0 0 1 336 176" fill="none" stroke="#06b6d4" stroke-width="20" stroke-linecap="round" filter="url(#neon)">
    <animate attributeName="opacity" values="0.15;1;0.15" keyTimes="0;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <path d="M 126 126 A 180 180 0 0 1 386 126" fill="none" stroke="#06b6d4" stroke-width="20" stroke-linecap="round" filter="url(#neon)">
    <animate attributeName="opacity" values="0.1;0.7;0.1" keyTimes="0;0.35;1" dur="2.4s" begin="0.45s" repeatCount="indefinite"/>
  </path>

  <!-- Mesh Connections (Inner lines from center to orbit) -->
  <path d="M 256 256 L 143 369" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)"/>
  <path d="M 256 256 L 369 369" fill="none" stroke="#22c55e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)"/>
  <!-- Dashed uplink with marching-ants flow (transmitting) -->
  <path d="M 256 256 L 256 96" fill="none" stroke="#06b6d4" stroke-width="12" stroke-dasharray="16 16" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="64;0" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- Traveling packets: core → delegate (amber) and core → fallback (green) -->
  <circle r="9" fill="#f59e0b" filter="url(#neon)">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.82;1" dur="2.2s" repeatCount="indefinite"/>
    <animateMotion path="M 256 256 L 143 369" dur="2.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.5 0 0.5 1"/>
  </circle>
  <circle r="9" fill="#22c55e" filter="url(#neon)">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.82;1" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
    <animateMotion path="M 256 256 L 369 369" dur="2.6s" begin="0.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.5 0 0.5 1"/>
  </circle>

  <!-- Central Core (Phone / Router) — pulsing beacon source -->
  <circle cx="256" cy="256" r="48" fill="#0f172a" stroke="#06b6d4" stroke-width="16" filter="url(#neon)">
    <animate attributeName="stroke-width" values="14;19;14" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="256" r="20" fill="#ffffff" filter="url(#neon)">
    <animate attributeName="r" values="18;25;18" dur="1.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>

  <!-- Satellite Node 1 (Amber: Heavy AI Delegate) -->
  <circle cx="143" cy="369" r="32" fill="#0f172a" stroke="#f59e0b" stroke-width="12" filter="url(#neon)">
    <animate attributeName="stroke-width" values="11;15;11" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="143" cy="369" r="12" fill="#ffffff"/>

  <!-- Satellite Node 2 (Green: Local AI Fallback) -->
  <circle cx="369" cy="369" r="32" fill="#0f172a" stroke="#22c55e" stroke-width="12" filter="url(#neon)">
    <animate attributeName="stroke-width" values="11;15;11" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="369" cy="369" r="12" fill="#ffffff"/>

</svg>
